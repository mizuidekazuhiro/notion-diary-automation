name: Codex Auto Fix

on:
  workflow_run:
    workflows: ["CI - Test & Requirements Gate"]
    types: [completed]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
      run_id:
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  autofix:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'codex:auto-fix') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '/codex fix') || contains(github.event.comment.body, '@codex fix') || contains(github.event.comment.body, '/codex explain') || contains(github.event.comment.body, '/codex plan'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target metadata
        id: meta
        uses: actions/github-script@v8
        with:
          script: |
            const ev = context.eventName;
            let pr = '', runId = '', branch = context.ref.replace('refs/heads/',''), wf='';
            if (ev === 'workflow_run') {
              runId = String(context.payload.workflow_run.id);
              wf = context.payload.workflow_run.name;
              branch = context.payload.workflow_run.head_branch;
              pr = context.payload.workflow_run.pull_requests?.[0]?.number?.toString() || '';
            } else if (ev === 'pull_request') {
              pr = String(context.payload.pull_request.number);
              branch = context.payload.pull_request.head.ref;
              wf = 'manual-label';
            } else if (ev === 'issue_comment') {
              pr = String(context.payload.issue.number);
              const pull = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(pr)});
              branch = pull.data.head.ref;
              wf = 'manual-comment';
            } else {
              pr = core.getInput('pr_number') || '';
              runId = core.getInput('run_id') || '';
              wf = 'workflow_dispatch';
            }
            core.setOutput('pr', pr);
            core.setOutput('run_id', runId);
            core.setOutput('branch', branch);
            core.setOutput('workflow', wf);

      - name: Guard retry count (max=2)
        id: guard
        env:
          AUTOFIX_KEY: ${{ steps.meta.outputs.run_id != '' && format('run-{0}', steps.meta.outputs.run_id) || format('pr-{0}', steps.meta.outputs.pr) }}
        run: python scripts/codex_autofix_guard.py
        continue-on-error: true

      - name: Stop and create issue when max exceeded
        if: steps.guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_WORKFLOW_NAME: ${{ steps.meta.outputs.workflow }}
          TARGET_RUN_ID: ${{ steps.meta.outputs.run_id }}
          TARGET_PR_NUMBER: ${{ steps.meta.outputs.pr }}
          TARGET_BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          python scripts/create_autofix_issue.py
          gh pr comment "${{ steps.meta.outputs.pr }}" --body "自動修正は上限（2回）に到達したため停止しました。最新ログと外部設定（Notion/Cloudflare/Secrets）を確認してください。"
          exit 0

      - name: Collect failure context
        env:
          TARGET_RUN_ID: ${{ steps.meta.outputs.run_id }}
          TARGET_PR_NUMBER: ${{ steps.meta.outputs.pr }}
          TARGET_BRANCH: ${{ steps.meta.outputs.branch }}
          TARGET_WORKFLOW_NAME: ${{ steps.meta.outputs.workflow }}
        run: python scripts/collect_ci_failure_context.py

      - name: /codex explain
        if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/codex explain')
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: gh pr comment "${{ steps.meta.outputs.pr }}" --body "失敗原因の推定: CIログまたは外部設定不整合が疑われます。.codex/failure_context.json を参照して切り分けてください。"

      - name: /codex plan
        if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/codex plan')
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: gh pr comment "${{ steps.meta.outputs.pr }}" --body "修正計画: 1) 失敗ジョブ特定 2) 最小修正 3) pytest/契約チェック実行 4) PR更新。"

      - name: Run codex fix loop (placeholder)
        if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/codex fix') || contains(github.event.comment.body, '@codex fix')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.meta.outputs.pr != '' && format('codex/autofix-pr-{0}', steps.meta.outputs.pr) || format('codex/autofix-{0}', steps.meta.outputs.run_id) }}"
          git checkout -B "$BRANCH"
          # 実運用ではここで Codex CLI に .codex/failure_context.json を渡して自動修正する
          pytest -q || true
          git add .codex/failure_context.json .codex/autofix_state.json || true
          git commit -m "chore: codex autofix context update" || true
          git push -u origin "$BRANCH" || true
          gh pr create --base "${{ steps.meta.outputs.branch }}" --head "$BRANCH" --title "Codex自動修正: ${{ steps.meta.outputs.workflow }}" --body-file - <<'PRBODY' || gh pr comment "${{ steps.meta.outputs.pr }}" --body "Codex自動修正ブランチを更新しました。"
## Codex自動修正レポート
- 検知した失敗内容: workflow失敗または手動指示により起動
- 推定原因: 失敗ログの要調査（型/lint/test/外部設定）
- 修正内容: 最小修正を試行（この雛形では文脈収集のみ）
- 実行したテスト: pytest -q
- テスト結果: ログ参照
- Notion / Cloudflare / GitHub Secrets / 外部サービス側で必要な設定変更: 必要時は追記
- 未確定事項: 失敗ジョブ詳細の追加調査
- 人間が確認すべきポイント: 失敗ログ、Secrets、DBスキーマ
PRBODY
