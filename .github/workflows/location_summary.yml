name: Location Summary Writer

on:
  workflow_run:
    workflows:
      - Daily Notion Diary - Phase A (Ingest)
    types:
      - completed
  workflow_dispatch:

jobs:
  run-location-summary:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/location_summary_writer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Location Summary Writer
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

          # 互換のため残す（Writer側が参照している可能性がある）
          LOCATION_LOG_DB_ID: ${{ secrets.LOCATION_LOG_DB_ID }}

          # ✅ 新しい参照先（今回追加）
          STAY_SESSIONS_DB_ID: ${{ secrets.STAY_SESSIONS_DB_ID }}

          # ✅ 既存のタスク管理DB（今回「予定」も読む）
          TASK_DB_ID: ${{ secrets.TASK_DB_ID }}
          EXPENSES_DB_ID: ${{ secrets.EXPENSES_DB_ID }}   # ← これを追加
          DAILY_LOG_DB_ID: ${{ secrets.DAILY_LOG_DB_ID }}
          DAILY_LOG_GPT_LOCATION_SUMMARY_PROP: "Location summary (GPT)"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT_DB_ID: ${{ secrets.PROMPT_DB_ID }}
          PROMPT_TARGET: "location_summary_writer"
          PROMPT_VARIANT: "default"
          PROMPT_LANGUAGE: "ja"
          PROMPT_TIME_STYLE: ""

          TZ: "Asia/Tokyo"
          WINDOW_START_HOUR: "5"
          TIME_BUCKET_MINUTES: "30"
          LOCATION_ROUND_DECIMALS: "4"
          DRY_RUN: "false"
        run: python src/main.py
