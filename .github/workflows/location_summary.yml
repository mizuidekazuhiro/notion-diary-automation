name: Location Summary Writer

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  run-location-summary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/location_summary_writer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Location Summary Writer
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LOCATION_LOG_DB_ID: ${{ secrets.LOCATION_LOG_DB_ID }}
          DAILY_LOG_DB_ID: ${{ secrets.DAILY_LOG_DB_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          TZ: "Asia/Tokyo"
          WINDOW_START_HOUR: "5"
          TIME_BUCKET_MINUTES: "30"
          LOCATION_ROUND_DECIMALS: "4"
          DRY_RUN: "false"
        run: python src/main.py
