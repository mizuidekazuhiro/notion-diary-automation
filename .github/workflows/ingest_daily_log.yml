name: Daily Diary 01 - Ingest Daily Log

on:
  workflow_dispatch:

concurrency:
  group: daily-diary-01-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/verify_requirements.py

      - name: Run ingest phase
        env:
          TASKS_CLOSED_URL: ${{ secrets.TASKS_CLOSED_URL }}
          DAILY_LOG_UPSERT_URL: ${{ secrets.DAILY_LOG_UPSERT_URL }}
          WORKERS_BEARER_TOKEN: ${{ secrets.WORKERS_BEARER_TOKEN }}
        run: python scripts/daily_job.py --phase ingest

      - name: Backfill missing Daily Logs (last 7 days)
        id: backfill_missing_diaries
        continue-on-error: true
        env:
          TASKS_CLOSED_URL: ${{ secrets.TASKS_CLOSED_URL }}
          DAILY_LOG_UPSERT_URL: ${{ secrets.DAILY_LOG_UPSERT_URL }}
          WORKERS_BEARER_TOKEN: ${{ secrets.WORKERS_BEARER_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          STAY_SESSIONS_DB_ID: ${{ secrets.STAY_SESSIONS_DB_ID }}
          TASK_DB_ID: ${{ secrets.TASK_DB_ID }}
          EXPENSES_DB_ID: ${{ secrets.EXPENSES_DB_ID }}
          DAILY_LOG_DB_ID: ${{ secrets.DAILY_LOG_DB_ID }}
          DAILY_LOG_GPT_LOCATION_SUMMARY_PROP: "Location summary (GPT)"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT_DB_ID: ${{ secrets.PROMPT_DB_ID }}
          PROMPT_TARGET: "location_summary_writer"
          PROMPT_VARIANT: "default"
          PROMPT_LANGUAGE: "ja"
          PROMPT_TIME_STYLE: ""
          INBOX_JSON_URL: ${{ secrets.INBOX_JSON_URL }}
          TASKS_JSON_URL: ${{ secrets.TASKS_JSON_URL }}
          VOICE_DIARY_NOTES_DB_ID: ${{ secrets.VOICE_DIARY_NOTES_DB_ID }}
          VOICE_DIARY_NOTES_MAX_COUNT: ${{ vars.VOICE_DIARY_NOTES_MAX_COUNT }}
          VOICE_DIARY_NOTES_MAX_CHARS: ${{ vars.VOICE_DIARY_NOTES_MAX_CHARS }}
          LOCATION_LOG_DB_ID: ${{ secrets.LOCATION_LOG_DB_ID }}
          LOCATION_LOG_TIME_PROP: ${{ secrets.LOCATION_LOG_TIME_PROP }}
          LOCATION_LOG_PLACE_PROP: ${{ secrets.LOCATION_LOG_PLACE_PROP }}
          EXPENSE_F_PROP: ${{ secrets.EXPENSE_F_PROP }}
          EXPENSE_DATE_PROP: ${{ secrets.EXPENSE_DATE_PROP }}
          EXPENSE_RECEIVED_AT_PROP: ${{ secrets.EXPENSE_RECEIVED_AT_PROP }}
          EXPENSE_MERCHANT_PROP: ${{ secrets.EXPENSE_MERCHANT_PROP }}
          EXPENSE_AMOUNT_PROP: ${{ secrets.EXPENSE_AMOUNT_PROP }}
          EXPENSE_CATEGORY_PROP: ${{ secrets.EXPENSE_CATEGORY_PROP }}
          OPENAI_MODEL: gpt-4.1-mini
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TZ: "Asia/Tokyo"
          WINDOW_START_HOUR: "5"
          TIME_BUCKET_MINUTES: "30"
          LOCATION_ROUND_DECIMALS: "4"
          DRY_RUN: "false"
        run: |
          set -o pipefail
          python scripts/backfill_missing_diaries.py --days 7 2>&1 | tee backfill_missing_diaries.log

      - name: Summarize backfill result
        if: always()
        run: |
          {
            echo "## Backfill missing Daily Logs"
            echo
            echo "Step outcome: ${{ steps.backfill_missing_diaries.outcome }}"
            echo
            if [ -f backfill_missing_diaries.log ]; then
              echo '```'
              tail -n 80 backfill_missing_diaries.log
              echo '```'
            else
              echo "backfill_missing_diaries.log was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
