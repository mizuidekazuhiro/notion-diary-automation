name: Daily Diary 04 - Publish Daily Mail
on:
  workflow_run:
    workflows:
      - Daily Diary 03 - Generate Diary & Sleep Insights
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: daily-diary-04-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/verify_requirements.py

      - name: Restore Notes label cache
        uses: actions/cache@v4
        with:
          path: .cache/notes_labels
          key: ${{ runner.os }}-notes-labels-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-notes-labels-v1-

      - name: Run publish
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INBOX_JSON_URL: ${{ secrets.INBOX_JSON_URL }}
          TASKS_JSON_URL: ${{ secrets.TASKS_JSON_URL }}
          TASKS_CLOSED_URL: ${{ secrets.TASKS_CLOSED_URL }}
          DAILY_LOG_UPSERT_URL: ${{ secrets.DAILY_LOG_UPSERT_URL }}
          WORKERS_BEARER_TOKEN: ${{ secrets.WORKERS_BEARER_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}   # ← これを追加
          MAIL_LINK_SECRET: ${{ secrets.MAIL_LINK_SECRET }}   # ←追加
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EXPENSES_DB_ID: ${{ secrets.EXPENSES_DB_ID }}
          EXPENSE_F_PROP: ${{ secrets.EXPENSE_F_PROP }}
          EXPENSE_DATE_PROP: ${{ secrets.EXPENSE_DATE_PROP }}
          EXPENSE_RECEIVED_AT_PROP: ${{ secrets.EXPENSE_RECEIVED_AT_PROP }}
          EXPENSE_MERCHANT_PROP: ${{ secrets.EXPENSE_MERCHANT_PROP }}
          EXPENSE_AMOUNT_PROP: ${{ secrets.EXPENSE_AMOUNT_PROP }}
          EXPENSE_CATEGORY_PROP: ${{ secrets.EXPENSE_CATEGORY_PROP }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_job.py --phase publish

      - name: Export daily mail quality artifacts
        if: always()
        continue-on-error: true
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAILY_LOG_UPSERT_URL: ${{ secrets.DAILY_LOG_UPSERT_URL }}
          WORKERS_BEARER_TOKEN: ${{ secrets.WORKERS_BEARER_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          MAIL_LINK_SECRET: ${{ secrets.MAIL_LINK_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EXPENSES_DB_ID: ${{ secrets.EXPENSES_DB_ID }}
          EXPENSE_F_PROP: ${{ secrets.EXPENSE_F_PROP }}
          EXPENSE_DATE_PROP: ${{ secrets.EXPENSE_DATE_PROP }}
          EXPENSE_RECEIVED_AT_PROP: ${{ secrets.EXPENSE_RECEIVED_AT_PROP }}
          EXPENSE_MERCHANT_PROP: ${{ secrets.EXPENSE_MERCHANT_PROP }}
          EXPENSE_AMOUNT_PROP: ${{ secrets.EXPENSE_AMOUNT_PROP }}
          EXPENSE_CATEGORY_PROP: ${{ secrets.EXPENSE_CATEGORY_PROP }}
          DAILY_MAIL_ARTIFACT_DIR: artifacts/daily_mail
          DAILY_MAIL_TODAY_ADVICE_MIN_CHARS: ${{ vars.DAILY_MAIL_TODAY_ADVICE_MIN_CHARS }}
          DAILY_MAIL_TODAY_ADVICE_MAX_CHARS: ${{ vars.DAILY_MAIL_TODAY_ADVICE_MAX_CHARS }}
        run: python scripts/export_daily_mail_artifacts.py

      - name: Upload daily mail quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-mail-quality-${{ github.run_id }}
          path: artifacts/daily_mail
          if-no-files-found: warn
          retention-days: 14

      - name: Create issue when daily mail quality needs review
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_MAIL_QUALITY_CREATE_ISSUE_ON: ${{ vars.DAILY_MAIL_QUALITY_CREATE_ISSUE_ON }}
        run: |
          set -euo pipefail
          python scripts/create_daily_mail_quality_issue.py \
            --report artifacts/daily_mail/quality_report.json \
            --issue-body artifacts/daily_mail/issue_body.md \
            --issue-title artifacts/daily_mail/issue_title.txt \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ ! -f artifacts/daily_mail/issue_body.md ] || [ ! -f artifacts/daily_mail/issue_title.txt ]; then
            echo "daily_mail_quality_issue_skip reason=no_issue_body"
            exit 0
          fi
          title="$(cat artifacts/daily_mail/issue_title.txt)"
          existing_issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body-file artifacts/daily_mail/issue_body.md
            echo "daily_mail_quality_issue_commented issue=$existing_issue"
          else
            gh issue create --title "$title" --body-file artifacts/daily_mail/issue_body.md
            echo "daily_mail_quality_issue_created title=$title"
          fi

      - name: Enforce final daily quality gate
        if: always()
        env:
          DAILY_QUALITY_GATE_FAIL_ON: fail
        run: |
          python scripts/enforce_daily_quality_gate.py \
            --report artifacts/daily_mail/quality_report.json \
            --markdown artifacts/daily_mail/quality_report.md
