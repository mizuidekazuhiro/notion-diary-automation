name: Diary Repair - Read-only Preview
on:
  workflow_dispatch:
  push:
    branches: ["fix/diary-evidence-integrity"]
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repair-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAILY_LOG_DB_ID: ${{ secrets.DAILY_LOG_DB_ID }}
          STAY_SESSIONS_DB_ID: ${{ secrets.STAY_SESSIONS_DB_ID }}
          TASK_DB_ID: ${{ secrets.TASK_DB_ID }}
          EXPENSES_DB_ID: ${{ secrets.EXPENSES_DB_ID }}
          PROMPT_DB_ID: ${{ secrets.PROMPT_DB_ID }}
          DIARY_EVAL_PUBLIC_KEY: ${{ vars.DIARY_EVAL_PUBLIC_KEY }}
          OPENAI_MAX_RETRIES: "1"
        run: python scripts/preview_recent_diary_repairs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diary-repair-preview-${{ github.run_id }}
          path: artifacts/repair_preview
          retention-days: 7
