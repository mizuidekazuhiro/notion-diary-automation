name: Notion Read-only Canary

on:
  workflow_run:
    workflows:
      - Daily Diary 04 - Publish Daily Mail
    types:
      - completed
  workflow_dispatch:
  schedule:
    # Fallback check after the normal Daily chain (05:30 UTC = 14:30 JST).
    - cron: "30 5 * * *"

concurrency:
  group: notion-readonly-canary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Validate Notion reads without writes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EXPENSES_DB_ID: ${{ secrets.EXPENSES_DB_ID }}
          HEALTH_DB_ID: ${{ secrets.HEALTH_DB_ID }}
          DAILY_LOG_DB_ID: ${{ secrets.DAILY_LOG_DB_ID }}
        run: python scripts/notion_readonly_canary.py
